name: Construire APK Israël Games

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Créer la configuration Capacitor
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.israelzongwe.israelgames",
            "appName": "Israël Games",
            "webDir": "www"
          }
          EOF

      - name: Créer le projet Android
        run: npx cap add android

      - name: Synchroniser l'application
        run: npx cap sync android

      - name: Construire APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: Israel-Games-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
